<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>朝政看板</title>
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font:14px/1.7 system-ui,'Microsoft YaHei',sans-serif;padding:20px;max-width:980px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;color:#38bdf8;border-left:4px solid #38bdf8;padding-left:8px;margin:22px 0 8px}
.sub{color:#64748b;font-size:12px;margin-bottom:12px}
.card{background:#1e293b;border-radius:10px;padding:14px 16px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid #334155}
th{color:#94a3b8;font-weight:600}
.up{color:#4ade80;font-weight:700}.down{color:#f87171;font-weight:700}
.warn{color:#fbbf24}
ul{margin:6px 0;padding-left:20px}li{margin:3px 0}
#st{color:#fbbf24}
</style></head><body>
<h1>🏛 朝政看板</h1>
<div class="sub">本机 · <span id="tm">-</span> · 每 30 秒自动刷新 · 用户专用</div>
<div class="card"><b>桥（中书·尚书）</b>：<span id="bridge">-</span> &nbsp;|&nbsp; <b>工部·ComfyUI</b>：<span id="comfy">-</span> &nbsp;|&nbsp; <b>任务进度</b>：<span id="st">-</span> <span id="el"></span></div>
<h2>磁盘（户部）</h2>
<div class="card"><table><tr><th>盘</th><th>可用</th><th>总容量</th><th>剩余占比</th></tr><tbody id="disk"></tbody></table></div>
<h2>廷议 · 待主公拍板</h2>
<div class="card"><ul id="pending"><li>-</li></ul></div>
<h2>最近动态（礼部案牍）</h2>
<div class="card"><table><tr><th>时间</th><th>任务</th></tr><tbody id="recent"></tbody></table></div>
<h2>最近报告（工部产出）</h2>
<div class="card"><table><tr><th>任务</th><th>文件</th><th>时间</th></tr><tbody id="reports"></tbody></table></div>
<script>
async function refresh(){
  document.getElementById('tm').textContent=new Date().toLocaleString('zh-CN');
  try{
    const r=await fetch('/system/board',{cache:'no-store'});const d=await r.json();
    document.getElementById('bridge').innerHTML='<span class="up">✅ 正常</span>';
    document.getElementById('comfy').innerHTML=d.comfyui==='up'?'<span class="up">✅ 运行中</span>':'<span class="down">⬇ 未启动（按需）</span>';
    const st=document.getElementById('st');
    if(d.progress&&d.progress.active){st.textContent='⏳ '+d.progress.tool+' · '+d.progress.count+'/'+d.progress.total+' 次';document.getElementById('el').textContent='· 已 '+d.progress.elapsed;}
    else{st.textContent='空闲';document.getElementById('el').textContent='';}
    document.getElementById('disk').innerHTML=d.disk.map(function(x){var pct=Math.round(x.freeGB/x.totalGB*100);return '<tr><td><b>'+x.drive+'</b></td><td>'+x.freeGB+' GB</td><td>'+x.totalGB+' GB</td><td>'+(pct<15?'<span class="warn">':'')+pct+'%'+(pct<15?'</span>':'')+'</td></tr>';}).join('')||'<tr><td colspan="4">-</td></tr>';
    document.getElementById('pending').innerHTML=d.pending.length?d.pending.map(function(x){return '<li>'+x+'</li>';}).join(''):'<li>无待决事项 ✅</li>';
    document.getElementById('recent').innerHTML=d.recent.map(function(x){return '<tr><td>'+x.ts+'</td><td>'+x.task+'</td></tr>';}).join('')||'<tr><td colspan="2">-</td></tr>';
    document.getElementById('reports').innerHTML=d.reports.map(function(x){return '<tr><td>'+x.task+'</td><td>'+x.file+'</td><td>'+x.time+'</td></tr>';}).join('')||'<tr><td colspan="3">-</td></tr>';
  }catch(e){document.getElementById('bridge').innerHTML='<span class="down">❌ 获取失败</span>';}
}
refresh();setInterval(refresh,30000);
</script>
</body></html>
